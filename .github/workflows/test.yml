name: Tests

# Tests d'intégration des Edge Functions (deno test) contre un vrai Postgres
# provisionné avec la lignée de migrations v3 (supabase/migrations). Miroir CI de
# scripts/test-local.sh (qui, lui, utilise `supabase db reset`).
#
# Deux inadéquations image-CI ↔ prod, gérées au provisioning (cf. étape ci-dessous) :
#   • le schéma `memento_v3` (search_path de prod, db.v3.ts) est référencé par les
#     migrations mais créé À LA MAIN au cutover → on le crée ici ;
#   • `pg_cron` (job de purge des rate-limits) est absent de l'image pgvector →
#     on retire ce bloc (non exercé par les tests).

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "server/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "server/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6

      - name: Provision v3 schema (supabase/migrations + auth.users stub)
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          # `memento_v3` = le search_path de prod (db.v3.ts). Les migrations le
          # référencent (rate_limits) mais ne le créent pas (créé à la main au
          # cutover) → on le crée. Les tables de base restent dans `public` (comme
          # l'apply brut) ; le search_path des tests (memento_v3,public,extensions)
          # couvre les deux.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create schema if not exists memento_v3;"
          for f in supabase/migrations/*.sql; do
            echo "applying $f"
            # pg_cron absent de l'image pgvector (présent via `supabase db reset`
            # localement) : on retire le job de purge (dernier bloc de rate_limits,
            # non exercé par les tests).
            awk '/CREATE EXTENSION IF NOT EXISTS pg_cron/{exit} {print}' "$f" \
              | psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          done
          # Supabase fournit `auth.users` en prod ; en CI on pose le même stub minimal
          # que server/src/seed-auth-local.ts (colonnes lues/écrites par les tests).
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "create schema if not exists auth; create table if not exists auth.users (id uuid primary key, email text, last_sign_in_at timestamptz);"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Tous les _shared/*.test.ts (DB-backed). On exclut mcp/*.test.ts : le .d.ts du
      # SDK MCP est absent du cache Deno (cf. CLAUDE.md) → pas de typecheck local fiable.
      - name: deno test (_shared, DB-backed)
        working-directory: supabase/functions
        run: |
          files=$(ls _shared/*.test.ts 2>/dev/null || true)
          echo "test files:"; echo "$files"
          deno test --allow-env --allow-net --allow-read $files
