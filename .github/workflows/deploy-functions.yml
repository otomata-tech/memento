name: Deploy edge functions

# Déploie les Edge Functions (api + mcp) sur le projet Supabase de PROD mento.cc
# (ref doebdriroupduqpggcsj) à chaque push sur main.
# Les tables vivent dans le schéma `memento_v3` de ce projet (db.v3.ts pose le
# search_path). PAS de migration DB ici (migrations sensibles → appliquées à la main).
# Gated par repository_owner (un fork ne déploie pas notre prod).
#
# Secret requis : SUPABASE_ACCESS_TOKEN (account-level).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-functions-v3
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository_owner == 'otomata-tech'
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: doebdriroupduqpggcsj # projet PROD mento.cc (cutover #58) — ref publique
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Deploy functions (api + mcp)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          rm -f supabase/functions/deno.lock
          supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
